<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PakePlus Android UI Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-highlight: rgba(255, 255, 255, 0.08);
      --primary: #8b5cf6;
      --primary-light: #a78bfa;
    }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }

    .glass-strong {
      background: rgba(30, 27, 46, 0.72);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .phone-frame {
      width: 360px;
      height: 720px;
      border-radius: 44px;
      box-shadow:
        0 0 0 12px #111827,
        0 25px 60px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.08);
      overflow: hidden;
      position: relative;
      background: #0f0f12;
    }

    .browser-frame {
      width: 100%;
      max-width: 1024px;
      height: 80vh;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.55);
      background: #0f0f12;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .drawer {
      transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .drawer.open {
      transform: translateX(0);
    }

    .scrim {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .scrim.open {
      opacity: 1;
      pointer-events: auto;
    }

    .popup {
      transform-origin: top right;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .popup.hidden {
      display: block;
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }

    .launch-overlay {
      transition: opacity 0.6s ease;
    }

    .launch-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .download-hint {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .download-hint.hidden {
      opacity: 0;
      transform: translate(-50%, -16px);
      pointer-events: none;
    }

    .tab-item.active {
      color: var(--primary-light);
    }

    .tab-item.active .tab-indicator {
      background: var(--primary);
    }

    .mode-btn.active {
      background: rgba(139, 92, 246, 0.35);
      border-color: rgba(167, 139, 250, 0.5);
      color: #fff;
    }

    iframe {
      background: #fff;
    }

    .app-icon {
      background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
      box-shadow: 0 12px 40px rgba(124, 58, 237, 0.45);
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-violet-950 to-slate-900 text-white flex flex-col items-center p-6">

  <!-- Launch Overlay -->
  <div id="launchOverlay" class="launch-overlay fixed inset-0 z-[100] flex flex-col items-center justify-center bg-black/80 backdrop-blur-2xl">
    <div class="app-icon w-24 h-24 rounded-3xl flex items-center justify-center mb-6">
      <svg class="w-14 h-14 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
    </div>
    <h1 class="text-3xl font-bold tracking-tight">PakePlus</h1>
    <p class="mt-2 text-white/60 text-sm">Android UI Preview</p>
  </div>

  <!-- Download Hint Toast -->
  <div id="downloadHint" class="download-hint hidden fixed top-6 left-1/2 -translate-x-1/2 z-[90] glass-strong rounded-full px-5 py-3 flex items-center gap-3">
    <svg class="w-5 h-5 text-violet-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
    </svg>
    <span id="downloadHintText" class="text-sm font-medium">开始下载...</span>
  </div>

  <!-- Header / Controls -->
  <header class="w-full max-w-5xl flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
    <div class="flex items-center gap-3">
      <div class="app-icon w-10 h-10 rounded-xl flex items-center justify-center">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-bold">PakePlus Android 预览</h1>
        <p class="text-xs text-white/50">config.json 三种布局模式可视化</p>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <button onclick="setMode('simple')" id="btn-simple" class="mode-btn px-4 py-2 rounded-lg text-sm font-medium border border-white/10 bg-white/5 hover:bg-white/10 transition">
        Simple
      </button>
      <button onclick="setMode('tabbar')" id="btn-tabbar" class="mode-btn px-4 py-2 rounded-lg text-sm font-medium border border-white/10 bg-white/5 hover:bg-white/10 transition">
        TabBar
      </button>
      <button onclick="setMode('drawer')" id="btn-drawer" class="mode-btn px-4 py-2 rounded-lg text-sm font-medium border border-white/10 bg-white/5 hover:bg-white/10 transition">
        Drawer
      </button>
      <div class="w-px h-6 bg-white/10 mx-1"></div>
      <button onclick="replayLaunch()" class="px-4 py-2 rounded-lg text-sm font-medium border border-white/10 bg-white/5 hover:bg-white/10 transition flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        重播启动
      </button>
      <button onclick="showDownloadHint()" class="px-4 py-2 rounded-lg text-sm font-medium border border-white/10 bg-violet-600/30 hover:bg-violet-600/50 transition flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        模拟下载
      </button>
    </div>
  </header>

  <!-- Preview Stage -->
  <main class="flex-1 w-full flex items-center justify-center">

    <!-- Simple Mode: Browser Mock -->
    <section id="simpleMode" class="hidden w-full flex items-center justify-center px-4">
      <div class="browser-frame flex flex-col">
        <div class="h-12 glass-strong flex items-center gap-3 px-4 shrink-0">
          <div class="flex gap-2">
            <span class="w-3 h-3 rounded-full bg-red-500/80"></span>
            <span class="w-3 h-3 rounded-full bg-yellow-500/80"></span>
            <span class="w-3 h-3 rounded-full bg-green-500/80"></span>
          </div>
          <div class="flex-1 flex items-center gap-2 bg-black/30 rounded-lg px-3 py-1.5 text-sm text-white/70 border border-white/5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <input id="simpleUrl" type="text" value="https://www.pakeplus.com/" class="bg-transparent outline-none w-full text-white/90" onkeydown="if(event.key==='Enter')loadSimple()" />
          </div>
          <button onclick="loadSimple()" class="p-1.5 hover:bg-white/10 rounded-md" title="重新加载">
            <svg class="w-4 h-4 text-white/70" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </button>
        </div>
        <div class="flex-1 relative min-h-0">
          <iframe id="simpleFrame" src="https://www.pakeplus.com/" class="absolute inset-0 w-full h-full border-0" allow="fullscreen"></iframe>
        </div>
      </div>
    </section>

    <!-- TabBar / Drawer Mode: Phone Mock -->
    <section id="phoneMode" class="hidden">
      <div id="phoneFrame" class="phone-frame flex flex-col">
        <!-- Status Bar -->
        <div class="h-7 bg-black/40 flex items-center justify-between px-5 text-[10px] text-white/80 shrink-0 z-20">
          <span>9:41</span>
          <div class="flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
          </div>
        </div>

        <!-- Top Header -->
        <div class="h-14 glass-strong flex items-center justify-between px-2 shrink-0 z-20">
          <button onclick="toggleDrawer()" class="p-2 rounded-full hover:bg-white/10 transition" aria-label="Menu">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
          <span class="text-lg font-semibold tracking-tight">PakePlus</span>
          <div class="relative">
            <button onclick="togglePopup()" class="p-2 rounded-full hover:bg-white/10 transition" aria-label="More">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </button>

            <!-- Popup Menu -->
            <div id="popupMenu" class="popup hidden absolute top-11 right-1 w-36 glass-strong rounded-xl overflow-hidden py-1">
              <button onclick="copyUrl()" class="w-full text-left px-4 py-2.5 text-sm hover:bg-white/10 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                复制网址
              </button>
              <button onclick="openExternal()" class="w-full text-left px-4 py-2.5 text-sm hover:bg-white/10 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                外部打开
              </button>
              <button onclick="reloadPhone()" class="w-full text-left px-4 py-2.5 text-sm hover:bg-white/10 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                重新加载
              </button>
            </div>
          </div>
        </div>

        <!-- Web Content -->
        <div class="flex-1 relative min-h-0 bg-white">
          <iframe id="phoneWebFrame" src="https://www.pakeplus.com/" class="absolute inset-0 w-full h-full border-0" allow="fullscreen"></iframe>
        </div>

        <!-- Bottom Tab Bar -->
        <div class="h-16 glass-strong flex items-center justify-around shrink-0 z-20">
          <button onclick="selectTab(0)" class="tab-item active flex flex-col items-center gap-1 px-6 py-1 text-white/60 hover:text-white transition" data-index="0">
            <div class="relative">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
              <span class="tab-indicator absolute -bottom-1 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full"></span>
            </div>
            <span class="text-[10px] font-medium">首页</span>
          </button>
          <button onclick="selectTab(1)" class="tab-item flex flex-col items-center gap-1 px-6 py-1 text-white/60 hover:text-white transition" data-index="1">
            <div class="relative">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
              <span class="tab-indicator absolute -bottom-1 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full"></span>
            </div>
            <span class="text-[10px] font-medium">收藏</span>
          </button>
          <button onclick="selectTab(2)" class="tab-item flex flex-col items-center gap-1 px-6 py-1 text-white/60 hover:text-white transition" data-index="2">
            <div class="relative">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              <span class="tab-indicator absolute -bottom-1 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full"></span>
            </div>
            <span class="text-[10px] font-medium">我的</span>
          </button>
        </div>

        <!-- Drawer Scrim -->
        <div id="drawerScrim" onclick="closeDrawer()" class="scrim absolute inset-0 bg-black/50 z-30"></div>

        <!-- Drawer -->
        <div id="drawer" class="drawer absolute top-0 left-0 h-full w-64 glass-strong border-r border-white/10 z-40 flex flex-col pt-12 px-5">
          <h2 class="text-xl font-bold mb-2">左侧菜单</h2>
          <div class="h-px bg-white/10 mb-4"></div>
          <nav class="flex flex-col gap-1">
            <button onclick="drawerItemClick('Home')" class="w-full text-left px-3 py-3 rounded-xl hover:bg-white/10 flex items-center gap-3 transition">
              <svg class="w-5 h-5 text-violet-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
              <span class="text-sm font-medium">Home</span>
            </button>
            <button onclick="drawerItemClick('Settings')" class="w-full text-left px-3 py-3 rounded-xl hover:bg-white/10 flex items-center gap-3 transition">
              <svg class="w-5 h-5 text-violet-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              <span class="text-sm font-medium">Settings</span>
            </button>
            <button onclick="drawerItemClick('About')" class="w-full text-left px-3 py-3 rounded-xl hover:bg-white/10 flex items-center gap-3 transition">
              <svg class="w-5 h-5 text-violet-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              <span class="text-sm font-medium">About</span>
            </button>
          </nav>
        </div>
      </div>
    </section>
  </main>

  <footer class="mt-8 text-xs text-white/30">
    PakePlus Android UI Preview · 模式切换 / 抽屉 / 弹窗 / 标签栏 / 下载提示
  </footer>

  <script>
    const targetUrl = 'https://www.pakeplus.com/';
    let currentMode = 'tabbar';
    let popupOpen = false;

    function $(id) { return document.getElementById(id); }

    function setMode(mode) {
      currentMode = mode;
      $('simpleMode').classList.add('hidden');
      $('phoneMode').classList.add('hidden');

      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      $('btn-' + mode).classList.add('active');

      if (mode === 'simple') {
        $('simpleMode').classList.remove('hidden');
        closeDrawer();
        closePopup();
      } else {
        $('phoneMode').classList.remove('hidden');
        if (mode === 'drawer') {
          openDrawer();
        } else {
          closeDrawer();
        }
        closePopup();
      }
    }

    function toggleDrawer() {
      const drawer = $('drawer');
      if (drawer.classList.contains('open')) {
        closeDrawer();
      } else {
        openDrawer();
      }
    }

    function openDrawer() {
      $('drawer').classList.add('open');
      $('drawerScrim').classList.add('open');
    }

    function closeDrawer() {
      $('drawer').classList.remove('open');
      $('drawerScrim').classList.remove('open');
    }

    function togglePopup() {
      popupOpen = !popupOpen;
      const popup = $('popupMenu');
      if (popupOpen) {
        popup.classList.remove('hidden');
      } else {
        popup.classList.add('hidden');
      }
    }

    function closePopup() {
      popupOpen = false;
      $('popupMenu').classList.add('hidden');
    }

    function selectTab(index) {
      document.querySelectorAll('.tab-item').forEach(item => {
        item.classList.remove('active');
        if (parseInt(item.dataset.index) === index) {
          item.classList.add('active');
        }
      });
      if (index === 1) {
        showDownloadHint('开始下载收藏内容...');
      }
    }

    function drawerItemClick(label) {
      showDownloadHint('已选择：' + label);
      closeDrawer();
    }

    function copyUrl() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(targetUrl).then(() => showDownloadHint('网址已复制'));
      } else {
        showDownloadHint('复制：' + targetUrl);
      }
      closePopup();
    }

    function openExternal() {
      window.open(targetUrl, '_blank');
      closePopup();
    }

    function reloadPhone() {
      const f = document.getElementById('phoneWebFrame');
      try {
        f.contentWindow.location.reload();
      } catch (e) {
        f.src = targetUrl;
      }
      closePopup();
    }

    function loadSimple() {
      const url = $('simpleUrl').value.trim();
      $('simpleFrame').src = url || targetUrl;
    }

    let hintTimer;
    function showDownloadHint(message) {
      const hint = $('downloadHint');
      const text = $('downloadHintText');
      text.textContent = message || '开始下载...';
      hint.classList.remove('hidden');
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => {
        hint.classList.add('hidden');
      }, 2200);
    }

    function replayLaunch() {
      const overlay = $('launchOverlay');
      overlay.classList.remove('hidden');
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 1500);
    }

    // Close popup when clicking outside
    document.addEventListener('click', (e) => {
      const popup = $('popupMenu');
      const btn = e.target.closest('button[aria-label="More"]');
      if (!popup.classList.contains('hidden') && !popup.contains(e.target) && !btn) {
        closePopup();
      }
    });

    // Initial state
    window.addEventListener('DOMContentLoaded', () => {
      setMode('tabbar');
      setTimeout(() => {
        $('launchOverlay').classList.add('hidden');
      }, 1600);
    });
  </script>
</body>
</html>
